name: 构建安卓 APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # AGP 8.2.1 配 Gradle 8.2.1，只支持到 JDK 20。用 21 会在配置阶段就报
      # Unsupported class file major version 65，连编译都进不去。
      # 要升 JDK 得先把 gradle-wrapper.properties 升到 8.5 以上。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm install

      - name: 同步网页到原生工程
        run: npx cap sync android

      - name: 还原签名 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/wallpaper.keystore"

      - name: 编译 APK（固定签名，可覆盖升级）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/wallpaper.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: suping-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
