<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>素屏</title>
<style>
  /* 全部取自「记问」的实际取色，两个 App 用同一套 */
  :root {
    --bg:      #F7F0E6;   /* 页面底 */
    --card:    #FAF3EB;   /* 比页面底略亮，用在浮起的元素上 */
    --sunk:    #F1E6D0;   /* 药丸、分段控件的凹陷底 */
    --line:    #E8DFCC;
    --ink:     #3A3529;   /* 正文 */
    --btn:     #5E5546;   /* 主按钮、开关打开态，就是记问「记一笔」那个暖褐 */
    --muted:   #8C8371;
    --warn:    #7F3B32;   /* 记问的支出红，这里只在出错时出现 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- 预览：图就是界面本身，不加卡片框 ---------- */
  /* 横向滑动浏览最近 8 天。第 0 屏是今天（也就是当前壁纸），往右是更早的。
     只能看，不能设也不能下载 —— 这样跟自动更新完全没有冲突。 */
  /* #stage 是 #preview / #empty / #dots 三者的定位祖先。
     少了它，那两个 absolute 元素会退回相对视口定位 —— 页码点会跑到屏幕最底下，
     压在「电池优化设置」那排按钮上，而不是压在照片下沿。 */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
  }
  /* 不用原生滚动 + scroll-snap：惯性滑动会一口气连翻好几页，收不住。
     改成一条 transform 轨道，一次手势最多走一页，位置就是 atIndex 这一个数，
     不再需要读写 scrollLeft，重画时也不会被滚动位置反咬。 */
  #preview {
    flex: 1 1 auto;
    min-width: 0;
    background: #EFE6D4;
    overflow: hidden;
    touch-action: pan-y;
  }
  #track {
    display: flex; height: 100%;
    will-change: transform;
  }
  .shot {
    flex: 0 0 100%;
    background: #EFE6D4 center/cover no-repeat;
    cursor: pointer;
  }
  /* 页码点。只有翻到非当天时才显形，平时不占视觉 */
  #dots {
    position: absolute; z-index: 2;
    left: 0; right: 0; bottom: 12px;
    display: flex; justify-content: center; gap: 6px;
    opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  #dots.show { opacity: 1; }
  #dots b {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,.45);
    box-shadow: 0 0 3px rgba(0,0,0,.5);
  }
  #dots b.on { background: #fff; }
  /* 照片不做任何压暗处理 —— 说明文字已经挪进面板，不需要为它牺牲画面。
     压暗层原来正好落在跟面板的交界处，一边最黑一边最亮，接缝非常难看。 */
  #caption {
    padding: 14px 0 13px;
    border-bottom: 1px solid var(--line);
  }
  #capText { font-size: 15px; line-height: 1.5; color: var(--ink); }
  #stamp { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  #empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    align-content: center; gap: 18px;
    color: var(--muted); font-size: 14px; text-align: center; padding: 0 40px;
  }
  /* 空态里的「屏」字。行书取自古帖，描摹成单条路径，不是字体也不依赖任何外部文件。
     压到很淡，是背景不是主角 —— 有壁纸的时候整块空态本来就不显示 */
  #mark { width: 74px; height: 74px; opacity: .16; }
  #mark path { fill: var(--ink); }
  /* #empty 是 ID 选择器，优先级高于 UA 样式表的 [hidden]{display:none}，
     不补这一条的话 .hidden = true 藏不住它 */
  #empty[hidden] { display: none; }

  /* ---------- 控制区：细分隔线，不用卡片 ---------- */
  #panel {
    position: relative; z-index: 2;
    flex: 0 0 auto;
    margin-top: -20px;                 /* 往上压住照片，接缝变成一道有意为之的圆角 */
    padding: 2px 20px calc(18px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 26px rgba(58,53,41,.16);
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; min-height: 52px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: 0; }
  .row .lab { color: var(--ink); }
  .row .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }

  /* 开关 */
  .sw { position: relative; width: 46px; height: 27px; flex: none; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
  .sw i {
    position: absolute; inset: 0; border-radius: 999px;
    background: #DED3B8; transition: background .18s ease; pointer-events: none;
  }
  .sw i::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%; background: #fff;
    transition: transform .18s ease;
  }
  .sw input:checked + i { background: var(--btn); }
  .sw input:checked + i::after { transform: translateX(19px); }
  .sw input:focus-visible + i { outline: 2px solid var(--btn); outline-offset: 2px; }

  /* 三选一 */
  #target { display: flex; flex: none; background: var(--sunk); border-radius: 9px; padding: 2px; }
  #target button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 5px 13px;
    border-radius: 6px; cursor: pointer;
  }
  #target button[aria-pressed="true"] {
    background: var(--card); color: var(--ink);
    box-shadow: 0 1px 3px rgba(58,53,41,.16);
  }

  /* 主按钮 */
  #go {
    width: 100%; margin-top: 16px;
    border: 0; border-radius: 14px;
    background: var(--btn); color: #FAF6ED;
    font: inherit; font-size: 16px; padding: 13px;
    cursor: pointer;
  }
  #go:active { background: #4C4539; }
  #go:disabled { background: var(--sunk); color: var(--muted); }

  #msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  #msg.bad { color: var(--warn); }

  #help {
    margin-top: 2px; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; gap: 20px;
  }
  #help button {
    border: 0; background: transparent; padding: 0;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  #help button:active { color: var(--ink); }

  /* ---------- 全屏预览 ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 50;
    background: #000;
    overflow: hidden;
    touch-action: none;
    opacity: 0; transition: opacity .18s ease;
  }
  #viewer[hidden] { display: none; }
  #viewer.on { opacity: 1; }
  #vtrack { display: flex; height: 100%; will-change: transform; }
  .vpage {
    flex: 0 0 100%; height: 100%;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .vpage img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    transform-origin: 0 0;
    -webkit-user-drag: none; user-select: none;
  }
  #vcap {
    position: fixed; left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 51; padding: 0 24px;
    color: rgba(255,255,255,.86); font-size: 13px; line-height: 1.5;
    text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.7);
    pointer-events: none;
    transition: opacity .18s ease;
  }
  #vcap[hidden], #viewer[hidden] + #vcap { display: none; }
  #viewer.zoomed ~ #vcap { opacity: 0; }
  #vcap.hide { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const W = () => window.Capacitor && window.Capacitor.Plugins.Wallpaper;

const $ = id => document.getElementById(id);
const msg = (t, bad) => { $('msg').textContent = t || ''; $('msg').className = bad ? 'bad' : ''; };

function stampText(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return '今天 ' + hm + ' 更新';
  const days = Math.round((now.setHours(0,0,0,0) - new Date(ms).setHours(0,0,0,0)) / 864e5);
  if (days === 1) return '昨天 ' + hm + ' 更新';
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm + ' 更新';
}

function dateLabel(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length !== 8) return '';
  const m = +yyyymmdd.slice(4,6), d = +yyyymmdd.slice(6,8);
  return m + '月' + d + '日';
}

let shots = [];        // 最近 8 天，[0] 是今天
let atIndex = 0;       // 当前停在第几屏
let atId = '';         // 当前这张的 id。重画后按 id 找回位置，而不是按下标 ——
                       // 列表长度会从 1 变 8，按下标必然被夹到 0
let st = {};           // getState() 的最近一次结果

/* ================= 单步翻页轨道 =================

    const n = count();

    if (!axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 1 : 2;
    }
    if (axis !== 1) return;
    e.preventDefault();
    moved = true;
    let d = dx;
    // 到两头给个阻尼，手感上告诉用户没有下一页了
    if ((index === 0 && d > 0) || (index === count() - 1 && d < 0)) d *= 0.3;
    track.style.transform = 'translateX(' + (base + d) + 'px)';
  }, { passive: false });

  const finish = e => {
    if (!dragging) return;
    dragging = false;
    if (axis !== 1) return;
    const dx = e.changedTouches[0].clientX - x0;
    const quick = Math.abs(dx) > 24 && Date.now() - t0 < 260;
    const step = (Math.abs(dx) > W_() * 0.18 || quick) ? (dx < 0 ? 1 : -1) : 0;
    go(index + step, true);          // 最多 ±1，连续翻页在这里被卡死
  };
  viewport.addEventListener('touchend', finish, { passive: true });
  viewport.addEventListener('touchcancel', finish, { passive: true });

  return {
    go,
    get index() { return index; },
    // 读一次就清掉。只用 getter 的话，滑动留下的 true 会把之后的点击一直吃掉 ——
    // 表现是「滑过之后第一次点图打不开预览，要点两下」
    consumeMoved() { const m = moved; moved = false; return m; },
    reflow() { go(index, false); }
  };
}

/* ================= 主预览 ================= */
function showCaption(i) {
  const it = shots[i];
  if (!it) return;
  $('capText').textContent = it.title || '';

  let stamp;
  if (i === 0) {
    if (st.pinDay) stamp = '今天的图，已固定为往期';
    else if (shots.synced === false) stamp = '今天的图，还没换上';
    else stamp = stampText(shots.lastTime) || '当前壁纸';
  } else if (st.pinDay && it.id && it.id === st.lastId) {
    stamp = dateLabel(it.date) + ' 的壁纸　已设为当前，明天恢复自动更换';
  } else {
    stamp = dateLabel(it.date) + ' 的壁纸';
  }
  $('stamp').textContent = stamp;
  $('caption').hidden = false;

  [...$('dots').children].forEach((b, n) => b.classList.toggle('on', n === i));
  $('dots').classList.toggle('show', shots.length > 1 && i !== 0);
}

// 主按钮的含义跟着当前屏走
function syncGo() {
  $('go').textContent = (atIndex > 0 && shots[atIndex]) ? '设为壁纸' : '立即更换';
}

const pager = Pager($('preview'), $('track'), i => {
  atIndex = i;
  if (shots[i]) atId = shots[i].id || '';
  showCaption(i);
  syncGo();
});

/* 原地更新，不清空重建。
   之前 innerHTML = '' 再 append，重画瞬间整块是空的 —— 远程图还没加载完就看到白屏，
   而且滚动位置被抹掉。现在节点数不变就只改背景图，位置压根不动。 */
function paint() {
  const track = $('track'), dots = $('dots');
  const n = shots.length;

  if (track.children.length !== n) {
    while (track.children.length > n) {
      track.lastChild.remove();
      if (dots.lastChild) dots.lastChild.remove();
    }
    while (track.children.length < n) {
      const d = document.createElement('div');
      d.className = 'shot';
      track.appendChild(d);
      dots.appendChild(document.createElement('b'));
    }
  }

  shots.forEach((it, i) => {
    const el = track.children[i];
    const want = it.src ? 'url("' + it.src + '")' : (it.bg || '');
    if (el.dataset.bgv !== want) {         // 一样就别碰，碰了就会重新解码一次图
      el.dataset.bgv = want;
      el.style.backgroundImage = want;
    }
  });

  $('empty').hidden = n > 0;

  // 按 id 找回刚才那张；找不到（比如列表整个换了）才回到第 0 屏
  let want = atId ? shots.findIndex(x => x.id === atId) : -1;
  if (want < 0) want = Math.min(atIndex, Math.max(0, n - 1));
  pager.go(want, false);
}

// 点图进全屏预览。刚划过的那一下不算点击
$('preview').addEventListener('click', e => {
  if (pager.consumeMoved()) return;
  const shot = e.target.closest('.shot');
  if (!shot || !shots.length) return;
  openViewer([...$('track').children].indexOf(shot));
});

window.addEventListener('resize', () => { pager.reflow(); if (vOpen) vPager.reflow(); });

/* ================= 全屏预览 ================= */
let vOpen = false, vScale = 1, vX = 0, vY = 0;
let vImg = null, vLastTap = 0, vSession = 0;
// transform-origin 是 0 0，所以要知道图片没被变换时的左上角和尺寸，
// 才能把「捏合中心保持不动」算对。不记下来的话缩放会绕左上角转，图往一边飘。
let vO = { x: 0, y: 0, w: 1, h: 1 };

// 把某个屏幕点 (ax,ay) 当锚点缩放到 k：先反算这个点在图片上的局部坐标，
// 再让它变换后仍落在原处
function vZoomAt(k, ax, ay) {
  const lx = (ax - vO.x - vX) / vScale;
  const ly = (ay - vO.y - vY) / vScale;
  vScale = k;
  vX = ax - vO.x - k * lx;
  vY = ay - vO.y - k * ly;
  vClamp();
}

// 放大后不许把图拖出屏幕；图比屏幕小时居中
function vClamp() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = vO.w * vScale, h = vO.h * vScale;
  if (w <= vw) vX = (vw - w) / 2 - vO.x;
  else vX = Math.min(-vO.x, Math.max(-vO.x - w + vw, vX));
  if (h <= vh) vY = (vh - h) / 2 - vO.y;
  else vY = Math.min(-vO.y, Math.max(-vO.y - h + vh, vY));
}

function vApply() {
  if (vImg) vImg.style.transform =
    'translate(' + vX + 'px,' + vY + 'px) scale(' + vScale + ')';
  const z = vScale > 1.01;
  $('viewer').classList.toggle('zoomed', z);
  $('vcap').classList.toggle('hide', z);
}

function vReset() {
  vScale = 1; vX = 0; vY = 0;
  if (vImg) { vImg.style.transition = ''; vImg.style.transform = ''; }
  vApply();
}

// 必须在 transform 清空的状态下量，量到的才是布局位置
function vMeasure() {
  if (!vImg) return;
  const r = vImg.getBoundingClientRect();
  if (r.width && r.height) vO = { x: r.left, y: r.top, w: r.width, h: r.height };
}

function vBind(i) {
  const page = $('vtrack').children[i];
  vImg = page ? page.querySelector('img') : null;
  vReset();
  vMeasure();
  // 图片可能还没解码完，尺寸要等 load 之后再量一次
  if (vImg && !vImg.complete) vImg.addEventListener('load', vMeasure, { once: true });
  const it = shots[i];
  $('vcap').textContent = it
    ? (it.title || '') + (it.date ? '　' + dateLabel(it.date) : '')
    : '';
}

const vPager = Pager($('viewer'), $('vtrack'), i => {
  if (!vOpen) return;
  vBind(i);
}, () => vScale <= 1.01);      // 放大状态下单指是平移，不翻页

function openViewer(i) {
  if (!shots.length) return;
  const box = $('viewer'), track = $('vtrack');
  vSession++;
  track.innerHTML = '';
  shots.forEach(it => {
    const page = document.createElement('div');
    page.className = 'vpage';
    const url = it.full || it.src || '';
    if (url) {
      const im = document.createElement('img');
      // 远程原图，不用本地那张：本地存的是 1080x1920 竖版裁切，放大了是糊的
      im.src = url; im.alt = '';
      page.appendChild(im);
    } else {
      page.style.backgroundImage = it.bg || '';   // 浏览器预览模式
    }
    track.appendChild(page);
  });
  box.hidden = false;
  $('vcap').hidden = false;
  vOpen = true;
  requestAnimationFrame(() => {
    vPager.go(Math.max(0, Math.min(i, shots.length - 1)), false);
    vBind(vPager.index);
    box.classList.add('on');
  });
}

function closeViewer() {
  if (!vOpen) return;
  vOpen = false;
  const box = $('viewer'), mine = ++vSession;
  box.classList.remove('on', 'zoomed');
  $('vcap').hidden = true;
  // 用 session 号挡住竞态：关闭动画没走完就又打开的话，
  // 这个回调必须什么都不做，否则会把刚建好的页面清掉，看到一片黑
  setTimeout(() => {
    if (mine !== vSession) return;
    box.hidden = true;
    $('vtrack').innerHTML = '';
    vImg = null;
  }, 200);
  // 下层跟到同一张，进出始终对齐
  pager.go(vPager.index, false);
}

/* 缩放：双指捏合，或双击。放大后单指平移。 */
(function vGestures() {
  const box = $('viewer');
  let mode = 0, moved = false;
  let sx = 0, sy = 0, ox = 0, oy = 0;
  let baseDist = 0, baseScale = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  box.addEventListener('touchstart', e => {
    if (!vOpen) return;
    if (e.touches.length === 2) {
      mode = 2; moved = true;
      baseDist = dist(e.touches) || 1;
      baseScale = vScale;
      if (vImg) vImg.style.transition = '';
    } else if (e.touches.length === 1 && vScale > 1.01) {
      mode = 1; moved = false;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      ox = vX; oy = vY;
    } else if (e.touches.length === 1) {
      mode = 0; moved = false;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }
  }, { passive: true });

  box.addEventListener('touchmove', e => {
    if (!vOpen) return;
    if (mode === 2 && e.touches.length === 2) {
      e.preventDefault();
      const k = Math.max(1, Math.min(baseScale * (dist(e.touches) / baseDist), 5));
      const ax = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const ay = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      vZoomAt(k, ax, ay);
      vApply();
    } else if (mode === 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
      vX = ox + dx; vY = oy + dy;
      vClamp();
      vApply();
    } else if (mode === 0) {
      const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    }
  }, { passive: false });

  box.addEventListener('touchend', e => {
    if (!vOpen) return;
    if (e.touches.length === 0) {
      // 没放大时向下甩一段就关闭
      if (mode === 0 && moved) {
        const t = e.changedTouches[0];
        if (t.clientY - sy > 90 && Math.abs(t.clientX - sx) < 60) { closeViewer(); }
      }
      if (vScale <= 1.01) vReset();
      mode = -1;                       // -1 表示这一轮手势已经处理完
      setTimeout(() => { if (mode === -1) mode = 0; }, 0);
    } else if (e.touches.length === 1) {
      mode = vScale > 1.01 ? 1 : 0;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      ox = vX; oy = vY;
      moved = true;
    }
  }, { passive: true });

  box.addEventListener('click', e => {
    if (!vOpen) return;
    if (vPager.consumeMoved() || moved) { moved = false; return; }
    const now = Date.now();
    if (now - vLastTap < 280) {        // 双击：1 倍 <-> 2.5 倍
      vLastTap = 0;
      if (vImg) vImg.style.transition = 'transform .2s ease';
      if (vScale > 1.01) vReset();
      else { vZoomAt(2.5, e.clientX, e.clientY); vApply(); }
      return;
    }
    vLastTap = now;
    const mark = vLastTap;
    setTimeout(() => { if (vOpen && vLastTap === mark) closeViewer(); }, 290);
  });
})();

// 实体返回键：预览开着时先关预览，而不是直接退出 App
const AppPlugin = window.Capacitor && window.Capacitor.Plugins
  && window.Capacitor.Plugins.App;
if (AppPlugin && AppPlugin.addListener) {
  AppPlugin.addListener('backButton', () => {
    if (vOpen) closeViewer();
    else if (AppPlugin.exitApp) AppPlugin.exitApp();
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && vOpen) closeViewer();
});

/* ================= 取数 / 渲染 ================= */
const DEMO_IMG = '';   // 想看真实照片效果的话，把任意一张图片的网址填进来
function demo() {
  const g = ['linear-gradient(168deg,#5B7C99 0%,#9DB4B8 38%,#C8BE9A 72%,#A89E7E 100%)',
             'linear-gradient(150deg,#6E5A4A 0%,#B49A78 55%,#E0CFA8 100%)',
             'linear-gradient(200deg,#3E5A5C 0%,#7FA0A0 50%,#BFC9B4 100%)'];
  shots = g.map((bg, i) => ({ src: '', bg, full: '', id: 'demo' + i, urlbase: '',
                              title: '哥德堡群岛的岸边，瑞典 (© Martin Wahlborg/Getty Images)',
                              date: '2026090' + (4 - i) }));
  if (DEMO_IMG) { shots[0].src = DEMO_IMG; shots[0].full = DEMO_IMG; }
  shots.lastTime = Date.now();
  paint();
  $('auto').checked = true;
  [...$('target').children].forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === 'both'));
  msg('浏览器预览模式，按钮不会真的换壁纸');
}

async function render() {
  const w = W();
  if (!w) return demo();

  const s = await w.getState();
  st = s;

  $('auto').checked = !!s.autoEnabled;
  [...$('target').children].forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === s.target));
  if (s.lastError) msg('上次自动更新失败：' + s.lastError, true);

  // 只有冷启动（还没有列表）才先用本地那张把界面立起来。
  // 已经有列表时绝不能退回单张 —— 那会把用户正在看的往期图挤掉，
  // 位置也会被夹回第 0 屏。这就是「设完壁纸自己跳回最新一张」的原因。
  if (!shots.length && s.imagePath) {
    shots = [{ id: 'local', src: window.Capacitor.convertFileSrc(s.imagePath) + '?t=' + s.lastTime,
               full: '', title: s.lastTitle || '', date: '' }];
    shots.lastTime = s.lastTime;
    paint();
  }

  // 再补最近 8 天。失败就保持现状，不报错打扰
  try {
    const r = await w.getRecent();
    const images = r.images || [];
    if (!images.length) return;
    // 本地那张是不是就是今天这张。是的话第 0 屏走本地文件（秒开、离线可看），
    // 不是的话第 0 屏改挂远程直链 —— 图和说明必须是同一张
    const synced = !!(s.imagePath && s.lastId && s.lastId === images[0].id);
    const list = images.map((it, i) => ({
      src: (i === 0 && synced)
        ? window.Capacitor.convertFileSrc(s.imagePath) + '?t=' + s.lastTime
        : r.imgHost + it.urlbase + r.imgSuffix,
      // 全屏预览和「设为壁纸」都用原图直链
      full: r.imgHost + it.urlbase + r.imgSuffix,
      id: it.id, urlbase: it.urlbase,
      title: it.title, date: it.date
    }));
    list.lastTime = s.lastTime;
    list.synced = synced;
    // 冷启动那张占位的 id 是 'local'，对不上任何一条，让它落回第 0 屏
    if (atId === 'local') atId = list[0].id;
    shots = list;
    paint();
  } catch (e) { /* 列表拿不到不影响主功能 */ }
}

/* ================= 交互 ================= */
$('auto').addEventListener('change', async e => {
  if (!W()) return;
  await W().setConfig({ autoEnabled: e.target.checked });
  msg(e.target.checked ? '' : '已关闭自动更换，只能手动更新了');
});

$('target').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  [...$('target').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  if (!W()) return;
  await W().setConfig({ target: b.dataset.v });
  msg('');
});

$('go').addEventListener('click', async () => {
  if (!W()) { msg('浏览器预览模式，按钮不会真的换壁纸'); return; }
  const it = atIndex > 0 ? shots[atIndex] : null;
  $('go').disabled = true;
  $('go').textContent = it ? '正在设置…' : '正在更换…';
  msg('');
  try {
    // 往期那张走 setSpecific，并把「今天」那张的 id 一起传过去当固定标记；
    // 第 0 屏还是走 updateNow，它会顺手解除固定
    const r = it
      ? await W().setSpecific({
          urlbase: it.urlbase, id: it.id, title: it.title || '',
          dayId: (shots[0] && shots[0].id) || ''
        })
      : await W().updateNow({ force: true });

    if (!r.ok) {
      msg(r.error || (it ? '设置失败' : '更换失败'), true);
    } else {
      const t = [...$('target').children].find(b => b.getAttribute('aria-pressed') === 'true').dataset.v;
      if (t !== 'home' && !r.lockOk) {
        msg('桌面已换好，但锁屏没能设置成功 —— 这台手机的系统可能不允许', true);
      } else if (it) {
        msg('已设为 ' + (dateLabel(it.date) || '这一天') + ' 的图，明天恢复自动更换');
      } else {
        msg('已换好');
      }
    }
  } catch (e) {
    msg(String(e.message || e), true);
  }
  $('go').disabled = false;
  syncGo();
  render();      // 刷新 pinDay / lastId；paint 会按 atId 把位置留在原处
});

$('btnPower').addEventListener('click', () => W() && W().openPowerSettings());
$('btnApp').addEventListener('click', () => W() && W().openAppSettings());

document.addEventListener('visibilitychange', () => {
  // 预览开着的时候不要 render：它会重建 shots，把正在看的那张抽掉
  if (!document.hidden && !vOpen) render();
});

render();
</script>
</body>
</html>
