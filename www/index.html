<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>素屏</title>
<style>
  /* 全部取自「记问」的实际取色，两个 App 用同一套 */
  :root {
    --bg:      #F7F0E6;   /* 页面底 */
    --card:    #FAF3EB;   /* 比页面底略亮，用在浮起的元素上 */
    --sunk:    #F1E6D0;   /* 药丸、分段控件的凹陷底 */
    --line:    #E8DFCC;
    --ink:     #3A3529;   /* 正文 */
    --btn:     #5E5546;   /* 主按钮、开关打开态，就是记问「记一笔」那个暖褐 */
    --muted:   #8C8371;
    --warn:    #7F3B32;   /* 记问的支出红，这里只在出错时出现 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- 预览：图就是界面本身，不加卡片框 ---------- */
  /* 横向滑动浏览最近 8 天。第 0 屏是今天（也就是当前壁纸），往右是更早的。
     只能看，不能设也不能下载 —— 这样跟自动更新完全没有冲突。 */
  #preview {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #EFE6D4;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  #preview::-webkit-scrollbar { display: none; }
  .shot {
    flex: 0 0 100%;
    scroll-snap-align: start;
    background: #EFE6D4 center/cover no-repeat;
  }
  /* 页码点。只有翻到非当天时才显形，平时不占视觉 */
  #dots {
    position: absolute; z-index: 2;
    left: 0; right: 0; bottom: 12px;
    display: flex; justify-content: center; gap: 6px;
    opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  #dots.show { opacity: 1; }
  #dots b {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,.45);
    box-shadow: 0 0 3px rgba(0,0,0,.5);
  }
  #dots b.on { background: #fff; }
  /* 照片不做任何压暗处理 —— 说明文字已经挪进面板，不需要为它牺牲画面。
     压暗层原来正好落在跟面板的交界处，一边最黑一边最亮，接缝非常难看。 */
  #caption {
    padding: 14px 0 13px;
    border-bottom: 1px solid var(--line);
  }
  #capText { font-size: 15px; line-height: 1.5; color: var(--ink); }
  #stamp { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  #empty {
    position: absolute; inset: 0 0 200px 0; display: grid; place-items: center;
    align-content: center; gap: 18px;
    color: var(--muted); font-size: 14px; text-align: center; padding: 0 40px;
  }
  /* 空态里的「屏」字。行书取自古帖，描摹成单条路径，不是字体也不依赖任何外部文件。
     压到很淡，是背景不是主角 —— 有壁纸的时候整块空态本来就不显示 */
  #mark { width: 74px; height: 74px; opacity: .16; }
  #mark path { fill: var(--ink); }
  /* #empty 是 ID 选择器，优先级高于 UA 样式表的 [hidden]{display:none}，
     不补这一条的话 .hidden = true 藏不住它 */
  #empty[hidden] { display: none; }

  /* ---------- 控制区：细分隔线，不用卡片 ---------- */
  #panel {
    position: relative; z-index: 2;
    flex: 0 0 auto;
    margin-top: -20px;                 /* 往上压住照片，接缝变成一道有意为之的圆角 */
    padding: 2px 20px calc(18px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 26px rgba(58,53,41,.16);
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; min-height: 52px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: 0; }
  .row .lab { color: var(--ink); }
  .row .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }

  /* 开关 */
  .sw { position: relative; width: 46px; height: 27px; flex: none; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
  .sw i {
    position: absolute; inset: 0; border-radius: 999px;
    background: #DED3B8; transition: background .18s ease; pointer-events: none;
  }
  .sw i::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%; background: #fff;
    transition: transform .18s ease;
  }
  .sw input:checked + i { background: var(--btn); }
  .sw input:checked + i::after { transform: translateX(19px); }
  .sw input:focus-visible + i { outline: 2px solid var(--btn); outline-offset: 2px; }

  /* 三选一 */
  #target { display: flex; flex: none; background: var(--sunk); border-radius: 9px; padding: 2px; }
  #target button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 5px 13px;
    border-radius: 6px; cursor: pointer;
  }
  #target button[aria-pressed="true"] {
    background: var(--card); color: var(--ink);
    box-shadow: 0 1px 3px rgba(58,53,41,.16);
  }

  /* 主按钮 */
  #go {
    width: 100%; margin-top: 16px;
    border: 0; border-radius: 14px;
    background: var(--btn); color: #FAF6ED;
    font: inherit; font-size: 16px; padding: 13px;
    cursor: pointer;
  }
  #go:active { background: #4C4539; }
  #go:disabled { background: var(--sunk); color: var(--muted); }

  #msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  #msg.bad { color: var(--warn); }

  #help {
    margin-top: 2px; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; gap: 20px;
  }
  #help button {
    border: 0; background: transparent; padding: 0;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  #help button:active { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
const W = () => window.Capacitor && window.Capacitor.Plugins.Wallpaper;

const $ = id => document.getElementById(id);
const msg = (t, bad) => { $('msg').textContent = t || ''; $('msg').className = bad ? 'bad' : ''; };

function stampText(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return '今天 ' + hm + ' 更新';
  const days = Math.round((now.setHours(0,0,0,0) - new Date(ms).setHours(0,0,0,0)) / 864e5);
  if (days === 1) return '昨天 ' + hm + ' 更新';
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm + ' 更新';
}

let shots = [];        // 最近 8 天，[0] 是今天
let atIndex = 0;       // 当前滑到第几屏

function dateLabel(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length !== 8) return '';
  const m = +yyyymmdd.slice(4,6), d = +yyyymmdd.slice(6,8);
  return m + '月' + d + '日';
}

// 说明区跟着滑动切换：第 0 屏显示更新时间，往期只显示日期
function showCaption(i) {
  const it = shots[i];
  if (!it) return;
  $('capText').textContent = it.title || '';
  $('stamp').textContent = i === 0
    ? (stampText(shots.lastTime) || '当前壁纸')
    : dateLabel(it.date) + ' 的壁纸';
  $('caption').hidden = false;

  [...$('dots').children].forEach((b, n) => b.classList.toggle('on', n === i));
  $('dots').classList.toggle('show', shots.length > 1 && i !== 0);
}

function paint() {
  const box = $('preview');
  box.innerHTML = '';
  $('dots').innerHTML = '';
  shots.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'shot';
    // 第 0 屏优先用本地文件：秒开，且断网时照样能看
    if (it.src) d.style.backgroundImage = 'url("' + it.src + '")';
    else if (it.bg) d.style.background = it.bg;
    box.appendChild(d);
    $('dots').appendChild(document.createElement('b'));
  });
  $('empty').hidden = shots.length > 0;
  showCaption(0);
}

$('preview').addEventListener('scroll', () => {
  const w = $('preview').clientWidth;
  if (!w) return;
  const i = Math.round($('preview').scrollLeft / w);
  if (i !== atIndex && shots[i]) { atIndex = i; showCaption(i); }
}, { passive: true });

const DEMO_IMG = '';   // 想看真实照片效果的话，把任意一张图片的网址填进来
function demo() {
  const g = ['linear-gradient(168deg,#5B7C99 0%,#9DB4B8 38%,#C8BE9A 72%,#A89E7E 100%)',
             'linear-gradient(150deg,#6E5A4A 0%,#B49A78 55%,#E0CFA8 100%)',
             'linear-gradient(200deg,#3E5A5C 0%,#7FA0A0 50%,#BFC9B4 100%)'];
  shots = g.map((bg, i) => ({ src: '', bg, title: '哥德堡群岛的岸边，瑞典 (© Martin Wahlborg/Getty Images)',
                              date: '2026090' + (4 - i) }));
  if (DEMO_IMG) shots[0].src = DEMO_IMG;
  shots.lastTime = Date.now();
  paint();
  $('auto').checked = true;
  [...$('target').children].forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === 'both'));
  msg('浏览器预览模式，按钮不会真的换壁纸');
}

async function render() {
  const w = W();
  if (!w) return demo();

  const s = await w.getState();

  $('auto').checked = !!s.autoEnabled;
  [...$('target').children].forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === s.target));
  if (s.lastError) msg('上次自动更新失败：' + s.lastError, true);

  // 先用本地那张把界面立起来，不等网络
  shots = [];
  shots.lastTime = s.lastTime;
  if (s.imagePath) {
    shots = [{ src: window.Capacitor.convertFileSrc(s.imagePath) + '?t=' + s.lastTime,
               title: s.lastTitle || '', date: '' }];
    paint();
  }

  // 再补最近 8 天。失败就保持只有一张，不报错打扰
  try {
    const r = await w.getRecent();
    const list = (r.images || []).map((it, i) => ({
      // 第 0 张仍旧用本地文件（秒开、离线可看），其余挂远程直链，不落地
      src: (i === 0 && s.imagePath)
        ? window.Capacitor.convertFileSrc(s.imagePath) + '?t=' + s.lastTime
        : r.imgHost + it.urlbase + r.imgSuffix,
      title: it.title, date: it.date
    }));
    if (list.length) {
      list.lastTime = s.lastTime;
      shots = list;
      paint();
    }
  } catch (e) { /* 列表拿不到不影响主功能 */ }
}

$('auto').addEventListener('change', async e => {
  if (!W()) return;
  await W().setConfig({ autoEnabled: e.target.checked });
  msg(e.target.checked ? '' : '已关闭自动更换，只能手动更新了');
});

$('target').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  [...$('target').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  if (!W()) return;
  await W().setConfig({ target: b.dataset.v });
  msg('');
});

$('go').addEventListener('click', async () => {
  if (!W()) { msg('浏览器预览模式，按钮不会真的换壁纸'); return; }
  $('go').disabled = true;
  $('go').textContent = '正在更换…';
  msg('');
  try {
    const r = await W().updateNow({ force: true });
    if (!r.ok) {
      msg(r.error || '更换失败', true);
    } else {
      const t = [...$('target').children].find(b => b.getAttribute('aria-pressed') === 'true').dataset.v;
      if (t !== 'home' && !r.lockOk) {
        msg('桌面已换好，但锁屏没能设置成功 —— 这台手机的系统可能不允许', true);
      } else {
        msg('已换好');
      }
    }
  } catch (e) {
    msg(String(e.message || e), true);
  }
  $('go').disabled = false;
  $('go').textContent = '立即更换';
  render();
});

$('btnPower').addEventListener('click', () => W() && W().openPowerSettings());
$('btnApp').addEventListener('click', () => W() && W().openAppSettings());

// 从后台切回来时刷新一次，可能期间已经自动换过了
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
</script>
</body>
</html>
